<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,800;1,8..60,400;1,8..60,600&family=UnifrakturMaguntia&display=swap" rel="stylesheet" data-pagedjs-ignore>
<style>
/* VOICE a real broadsheet front page and a city-magazine service page, for one reader
   IDEA newsprint: skybox teasers above a blackletter masthead, dateline rules, ruled columns, a bold ink drawing, a scalloped sticker
   PICTURE a heavy-ink drawing of a reading corner (books, mug, lamp, water lilies, plant) with solid black fills
   COLOUR grey newsprint and black ink only
   TYPE UnifrakturMaguntia masthead, Instrument Serif display, Source Serif bold statements and spaced small caps, Newsreader text
   LAYOUT front: skybox, masthead with ears, dateline, three ruled columns (your day | story + drawing | quote + prompt); inside: three-column story; back: ruled puzzle grid and journal */

:root{color-scheme:light;--ink:#1d1b1a;--soft:#4f4c46;--rule:#1d1b1a;--hair:#9f9b92;--paper:#ecebe6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{color:var(--ink);font:9.4pt/1.42 "Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;font-variant-numeric:oldstyle-nums}
.sc{font:600 7.2pt/1.25 "Source Serif 4",Georgia,serif;letter-spacing:.16em;text-transform:uppercase}
.tag{font:600 6.6pt/1 "Source Serif 4",Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
p{margin:0}
/* ---------- front ---------- */
.front{break-after:page;height:270mm;display:flex;flex-direction:column}
.sky{display:grid;grid-template-columns:1fr 1fr;border-top:.6pt solid var(--rule);border-bottom:.6pt solid var(--rule);padding:2mm 0}
.sky>div{display:grid;grid-template-columns:17mm 1fr;gap:3mm;align-items:center;padding:0 3mm}
.sky>div+div{border-left:.4pt solid var(--hair)}
.sky svg{width:17mm;height:12mm}
.sky b{display:block;font:800 10.5pt/1.1 "Source Serif 4",Georgia,serif;text-transform:uppercase;margin:.8mm 0}
.mastrow{display:grid;grid-template-columns:34mm 1fr 34mm;align-items:center;padding:3mm 0 1.5mm}
.ear{border:.5pt solid var(--rule);padding:1.6mm 2mm;text-align:center}
.wx{display:grid;grid-template-columns:9mm 1fr;gap:1.5mm;align-items:center;text-align:left;padding:1.4mm 1.8mm}
.wx svg{width:9mm;height:7.2mm}
.wx .sc{font-size:6.2pt;letter-spacing:.12em;display:block}
.wx b{display:block;font:800 12pt/1.05 "Source Serif 4",Georgia,serif;font-variant-numeric:lining-nums;margin:.4mm 0}
.wx i{font-weight:400;font-style:normal;font-size:9pt}
.wxt{display:block;font:italic 7pt/1.15 "Newsreader",Georgia,serif}
.mast{font:47pt/1 "UnifrakturMaguntia",serif;text-align:center;white-space:nowrap;margin:0}
.dateline{display:flex;justify-content:space-between;border-top:.6pt solid var(--rule);border-bottom:2.2pt double var(--rule);padding:1.2mm 1mm;margin-bottom:3mm}
.grid{flex:1;display:grid;grid-template-columns:40mm 1fr 41mm;min-height:0}
.grid>*{padding:0 3.2mm}
.grid>*+*{border-left:.4pt solid var(--hair)}
.grid>:first-child{padding-left:0}
.grid>:last-child{padding-right:0}
.colhead{font:400 20pt/1 "Instrument Serif",Georgia,serif;margin:0 0 1mm}
.agenda{list-style:none;margin:2.5mm 0 0;padding:0}
.agenda li{display:grid;grid-template-columns:9mm 1fr;column-gap:1.5mm;padding:1.1mm 0;border-bottom:.4pt solid var(--hair);font-size:8.6pt;line-height:1.2;min-height:6.2mm}
.agenda time{font:600 8pt "Source Serif 4",Georgia,serif;font-variant-numeric:lining-nums}
.agenda em{grid-column:2;font-size:7.4pt;color:var(--soft)}
.agenda li.ev span{font-weight:600}
.sample{font-style:italic;font-size:7.2pt;color:var(--soft);margin-top:1.5mm}
.notes{margin-top:4mm}
.notes i{display:block;height:6.4mm;border-bottom:.4pt solid var(--hair)}
.center{position:relative;display:flex;flex-direction:column}
.center h1{font:400 46pt/.88 "Instrument Serif",Georgia,serif;letter-spacing:-.015em;text-align:center;margin:0;text-wrap:balance}
.center .dek{font:italic 400 10.5pt/1.3 "Newsreader",Georgia,serif;text-align:center;margin:2mm 0 1.5mm}
.center .byl{text-align:center;margin-bottom:2.5mm}
.art{display:block;width:100%;height:auto;border-top:.4pt solid var(--hair);border-bottom:.4pt solid var(--hair);padding:2mm 0}
.cap{font:italic 7.2pt/1.3 "Newsreader",Georgia,serif;color:var(--soft);margin:1mm 0 2.5mm}
.lead{font-size:10pt;line-height:1.45;columns:2;column-gap:4.5mm;column-rule:.4pt solid var(--hair);text-align:justify;hyphens:auto}
.lead p{margin:0 0 1.8mm}
.lead p:first-child::first-letter{float:left;font:400 3.3em/.8 "Instrument Serif",Georgia,serif;padding:.04em .05em 0 0}
.cont{font:italic 7.6pt "Newsreader",Georgia,serif;text-align:right;padding-top:.5mm}
.index{margin-top:auto;border-top:2.2pt double var(--rule);padding-top:2mm}
.index ul{list-style:none;margin:1.5mm 0 0;padding:0;columns:2;column-gap:5mm}
.index li{display:flex;justify-content:space-between;gap:2mm;font-size:8.6pt;padding:.9mm 0;border-bottom:.4pt dotted var(--hair);break-inside:avoid}
.index b{font:800 8.6pt "Source Serif 4",Georgia,serif}
.artwrap{position:relative}
.badge{position:absolute;right:-2mm;top:-4mm;width:27mm;height:27mm;transform:rotate(9deg)}
.badge svg{position:absolute;inset:0;width:100%;height:100%}
.badge div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.badge small{font:600 5.6pt "Source Serif 4",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.badge strong{font:italic 400 13pt/.95 "Instrument Serif",Georgia,serif;margin:.6mm 0}
.right{display:flex;flex-direction:column}
.big{font:800 12.6pt/1.18 "Source Serif 4",Georgia,serif;text-align:center;padding:1mm 0 3mm;border-bottom:.6pt solid var(--rule)}
.big span{display:block;font:400 8pt/1.3 "Newsreader",Georgia,serif;margin-top:1.5mm}
.small{text-align:center;padding:3mm 0;border-bottom:.6pt solid var(--rule);font-size:8.6pt;line-height:1.3}
.small b{font:800 9.6pt/1.2 "Source Serif 4",Georgia,serif}
.small .tag{display:block;margin-bottom:1.5mm}
.toq{margin-top:auto;padding-top:3mm;text-align:center}
.toq p{font:400 15pt/1.08 "Instrument Serif",Georgia,serif;margin:1.5mm 0 0}
/* ---------- story ---------- */
.story{break-before:page}
.s-top{display:flex;justify-content:space-between;align-items:end;border-bottom:.6pt solid var(--rule);padding-bottom:1.5mm;margin-bottom:3mm}
.s-top .mini{font:15pt/1 "UnifrakturMaguntia",serif}
.story h2{font:400 33pt/.95 "Instrument Serif",Georgia,serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
.story .dek{font:italic 400 12pt/1.3 "Newsreader",Georgia,serif;margin:2mm 0 1.5mm}
.story .byl{margin:0 0 3mm;padding-bottom:2.5mm;border-bottom:2.2pt double var(--rule)}
.short{column-span:all;display:grid;grid-template-columns:24mm 1fr;gap:4mm;border-bottom:.6pt solid var(--rule);padding-bottom:3mm;margin-bottom:3.5mm}
.short .colhead{font-size:17pt}
.short p{font:600 9.2pt/1.4 "Source Serif 4",Georgia,serif;margin:0 0 1.5mm}
.cols{columns:3;column-gap:5mm;column-rule:.4pt solid var(--hair)}
.cols p{margin:0 0 1.9mm;text-align:justify;hyphens:auto}
.cols .lede::first-letter{float:left;font:400 3.4em/.8 "Instrument Serif",Georgia,serif;padding:.04em .05em 0 0}
.cols .pull{font:800 9.4pt/1.35 "Source Serif 4",Georgia,serif;text-align:left}
.cols h3{font:400 15pt/1.02 "Instrument Serif",Georgia,serif;margin:3.5mm 0 1.5mm;break-after:avoid}
.cols h4{font:600 7.2pt/1.25 "Source Serif 4",Georgia,serif;letter-spacing:.16em;text-transform:uppercase;margin:3.5mm 0 1.2mm;break-after:avoid}
.cols ul,.cols ol{margin:0 0 2mm;padding-left:4mm}
.cols li{margin:0 0 .7mm}
.cols blockquote{margin:2.5mm 0;padding:2mm 0;border-top:.6pt solid var(--rule);border-bottom:.6pt solid var(--rule);font:800 10.5pt/1.3 "Source Serif 4",Georgia,serif;text-align:center}
.cols blockquote i{font-style:normal}
.cols .note{display:block;margin:2.5mm 0;padding:2mm 2.5mm;border:.6pt solid var(--rule);font-size:8.6pt}
.story figure{margin:0 0 2.5mm;break-inside:avoid}
.story figure img{display:block;width:100%;height:42mm;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.story figcaption{font:italic 7pt/1.3 "Newsreader",Georgia,serif;color:var(--soft);margin-top:1mm}
/* ---------- back ---------- */
.back{break-before:page}
.b-title{text-align:center;border-top:.6pt solid var(--rule);border-bottom:.6pt solid var(--rule);padding:1.5mm 0;margin-bottom:2mm}
.b-head{font:400 54pt/.88 "Instrument Serif",Georgia,serif;text-transform:uppercase;letter-spacing:-.02em;text-align:center;margin:2mm 0 3mm}
.b-grid{display:grid;grid-template-columns:auto 1fr;border-top:2.2pt double var(--rule);border-bottom:.6pt solid var(--rule)}
.b-grid>div{padding:4mm 4mm}
.b-grid>div+div{border-left:.4pt solid var(--hair);padding-right:0}
.b-grid>div:first-child{padding-left:0}
.ws{display:grid;grid-template-columns:repeat(13,7.3mm);grid-auto-rows:7.3mm;border:.8pt solid var(--rule)}
.ws span{display:grid;place-items:center;font:600 10.5pt/1 "Source Serif 4",Georgia,serif;font-variant-numeric:lining-nums}
.words{list-style:none;margin:2mm 0 0;padding:0}
.words li{font:600 9.4pt/1 "Source Serif 4",Georgia,serif;padding:1.5mm 0 1.5mm 5.5mm;border-bottom:.4pt solid var(--hair);position:relative}
.words li::before{content:"";position:absolute;left:0;top:1.3mm;width:2.8mm;height:2.8mm;border:.6pt solid var(--ink)}
.solution{margin-top:4mm;transform:rotate(180deg);width:max-content}
.solution .ws{grid-template-columns:repeat(13,2.9mm);grid-auto-rows:2.9mm;border-width:.4pt}
.solution .ws span{font:500 4.8pt/1 Arial,sans-serif;color:#aaa}
.solution .ws span.on{color:var(--ink);font-weight:700}
.journal{display:grid;grid-template-columns:52mm 1fr;margin-top:0;border-bottom:.6pt solid var(--rule)}
.journal>div{padding:4mm 4mm 3mm}
.journal>div:first-child{padding-left:0;border-right:.4pt solid var(--hair)}
.journal>div:last-child{padding-right:0}
.prompt{font:400 17pt/1.18 "Instrument Serif",Georgia,serif;margin:2mm 0 0}
.lines i{display:block;height:8mm;border-bottom:.5pt solid var(--ink)}
</style>
<style data-pagedjs-ignore>
@media screen{
html,body{background:#9d998f!important}
.pagedjs_pages{display:flex!important;flex-direction:column;align-items:center;gap:28px;padding:28px 12px 48px;width:100%!important}
.pagedjs_page{box-shadow:0 2px 4px rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.18);flex:none}
}
@media print{.pagedjs_pages{display:block}}
</style>
</head>
<body>
<!--
  THE DAILY PICKS
  Abrí este archivo en Chrome para ver el diario. Para imprimir: Cmd/Ctrl + P → "Guardar como PDF" o tu impresora.
  Tus datos van en config.local.js y edition.local.js (copias de config.js y edition.js).
  Esos dos archivos están en .gitignore: nunca se suben a GitHub.
-->
<div id="daily"></div>
<!-- Datos de ejemplo (se suben a GitHub) -->
<script src="config.js"></script>
<script src="edition.js"></script>
<!-- Tus datos reales: si existen, reemplazan a los de ejemplo. Están en .gitignore, nunca se suben. -->
<script src="config.local.js"></script>
<script src="edition.local.js"></script>
<script src="render.js"></script>
<script>
window.PagedConfig = {
  auto: true,
  before: () => window.renderDaily(),
  after: () => {
    window.fixPageRefs();
    const fit = () => { const p = document.querySelector('.pagedjs_pages'); if (!p) return; const w = document.querySelector('.pagedjs_page')?.offsetWidth || 794; p.style.zoom = Math.min(1, (window.innerWidth - 24) / w); };
    fit(); window.addEventListener('resize', fit);
  }
};
</script>
<script src="paged.js"></script>
</body>
</html>
